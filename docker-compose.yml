services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kesinuru
      POSTGRES_USER: kesinuru
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - kesinuru_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kesinuru -d kesinuru"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kesinuru_postgres:
